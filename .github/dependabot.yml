version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    groups:
      documentation:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    groups:
      testing:
        patterns: ['*']
